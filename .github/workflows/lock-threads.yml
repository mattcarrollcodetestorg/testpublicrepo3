name: 'Lock Threads'
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
  discussions: write
concurrency:
  group: lock-threads
jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: '0'
          pr-inactive-days: '0'
          discussion-inactive-days: '0'
